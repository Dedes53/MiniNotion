<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Notion</title>
    <link rel="icon" type="image/x-icon" href="assets/imgs/images.jpg" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <h1>Mini Notion</h1>
    </header>

    <main>
      <section calss="newNote">
        <fieldset>
          <legend>New Note</legend>
          <form action="">
            <!-- creare il form per aggiungere una nuova nota con titolo e corpo. 
             leggenda del form con scritto nuova nota e due campi 
              -->
            <input type="text" name="noteTitle" id="noteTitle" placeholder=" Title" required />
            <input type="text" name="noteText" id="noteText" placeholder=" Text" required />
            <button id="create">Create Note</button>
          </form>
        </fieldset>
      </section>

      <section calss="note">
        <h2>Your Notes</h2>
        <ul id="noteList"></ul>
      </section>
    </main>

    <footer></footer>

    <script src="assets/js/index.js"></script>
  </body>
</html>
